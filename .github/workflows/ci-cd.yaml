name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest httpx lark

      - name: Download model
        run: |
          python - << 'EOF'
          from transformers import AutoModelForImageClassification, AutoImageProcessor
          from PIL import Image
          import torch, torch.nn as nn, os

          processor = AutoImageProcessor.from_pretrained("google/efficientnet-b0")
          model = AutoModelForImageClassification.from_pretrained("google/efficientnet-b0")
          model.eval()

          class EfficientNetExplicit(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.efficientnet = model.efficientnet
                  self.classifier = model.classifier
              def forward(self, pixel_values):
                  outputs = self.efficientnet(pixel_values)
                  x = outputs.last_hidden_state
                  x = torch.mean(x, dim=[2, 3])
                  return self.classifier(x)

          wrapped = EfficientNetExplicit(model)
          wrapped.eval()
          dummy = torch.randn(1, 3, 224, 224)
          os.makedirs("models", exist_ok=True)
          torch.onnx.export(wrapped, dummy, "models/model.onnx",
              input_names=["pixel_values"], output_names=["logits"],
              opset_version=18, dynamo=False)
          print("Model exported!")
          EOF

      - name: Run tests
        run: |
          PYTHONPATH=/home/runner/work/binsmart/binsmart pytest tests/ -v